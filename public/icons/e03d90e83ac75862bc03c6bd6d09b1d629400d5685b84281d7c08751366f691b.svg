<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3F3D56;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Brain/memory icon -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#grad)" stroke-width="2"/>
  <!-- Neural network nodes -->
  <circle cx="24" cy="24" r="4" fill="url(#grad)"/>
  <circle cx="40" cy="24" r="4" fill="url(#grad)"/>
  <circle cx="32" cy="36" r="4" fill="url(#grad)"/>
  <circle cx="20" cy="36" r="3" fill="url(#grad)" opacity="0.6"/>
  <circle cx="44" cy="36" r="3" fill="url(#grad)" opacity="0.6"/>
  <!-- Connections -->
  <line x1="24" y1="24" x2="40" y2="24" stroke="url(#grad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="24" y1="24" x2="32" y2="36" stroke="url(#grad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="40" y1="24" x2="32" y2="36" stroke="url(#grad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="36" x2="24" y2="24" stroke="url(#grad)" stroke-width="1" opacity="0.3"/>
  <line x1="44" y1="36" x2="40" y2="24" stroke="url(#grad)" stroke-width="1" opacity="0.3"/>
  <line x1="20" y1="36" x2="32" y2="36" stroke="url(#grad)" stroke-width="1" opacity="0.3"/>
  <line x1="44" y1="36" x2="32" y2="36" stroke="url(#grad)" stroke-width="1" opacity="0.3"/>
</svg>
